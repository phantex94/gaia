# Intent Envelope (shared by every intent template; field names are fixed)
# File: <intent folder>/<task>.yaml (default docs/intent/), committed by the builder after Gate 1B.
# Layout: these envelope fields first, then the matching body template, then roadmap, then graph_slice.

task: "<board key + slug, e.g. abc-12-short-name | without a board: yyyy-mm-dd-short-name>"
status: confirmed                  # unconfirmed | confirmed | building | delivered | superseded
confirmed:
  by: "<human>"
  on: "<yyyy-mm-dd>"
  via: "<coordinator | qstack:why>"
supersedes: ""                     # Optional: earlier intent file this one replaces
sources:                           # What Read-Before-Asking read (files, ADR ids, design/component page ids)
  - "<path or page id>"

# <body template goes here: greenfield | brownfield-add | brownfield-improve | brownfield-evolve | ops-change>

objections:                        # Every finding from interrogate; only the human closes one
  - id: O1
    issue: "<what is unclear, contradictory or risky>"
    resolution: answer             # answer | non_goal
    text: "<the human's choice, or what is out of scope>"
ambiguity:                         # New Medium+ only; omit entirely for Fast Path; preserve snapshot
  estimator: heuristic_v1
  calibrated: false
  score: null                      # 0–100 approximate integer OR null with score_range
  score_range: [0, 100]            # Replace with defensible interval, null if point supplied
  method: "<independent_approx | joint | bounds | calibrated>"
  coverage_residual: null          # Unknown is not zero
  slots: []                        # {id, proposed, alternatives, evidence, mismatch_probability, loss, group}
  residual_risk: { value: null, range: null, unit: "<explicit unit>", reason: "<if unknown>" }
  hard_open: { red: null, yellow: null, authority: null }
  required_sources_ok: null
  human_cost: { batches: 0, questions: 0, confirmations: 0 }
  history: []                      # {stage, score, score_range, delta_pp, hard_open, residual_risk, evidence, next}
  outcome: "<GO | GO_SCOPED | BLOCKED | pending>"
  reason: ""
decisions: []                      # Later human answers, append dated before/after ambiguity receipts if reopened

roadmap:                           # Outcome-level at Gate 1; refined into CLI <-> sub-path or node contracts at Gate 1B
  task_shape: "<graph sub-path delivery | single-node task | ops change>"
  graph:                           # Optional, graph tasks only
    shared_nodes: ["<N1: e.g. pit_panel_view (reused by build, run, evaluate)>"]
    overview: "<Raw -> [N1] -> [N2] -> [N3]>"
  phases:
    - id: P0
      deliverable: "<Round 3 skeleton or delta on the existing layout -> Gate 1B>"
      acceptance: "<plan approved>"
      status: todo                 # todo | done | deferred
      evidence: ""                 # Commit, command + result, or approval note
    - id: P1
      deliverable: "<core CLI <-> compute-graph sub-path, or node contract>"
      acceptance: "<hand-calc oracle + future perturbation + Batch == Step on synthetic data>"
      status: todo
      evidence: ""

graph_slice:                       # Round 3 (Gate 1B), graph tasks only: what this task changes in <intent folder>/graph.yaml
  nodes:                           # Ids as in graph.yaml after this task's PR
    - { id: "<node id>", mode: add }                  # add | rewire | polish
  edges:
    - { from: "<node id>", to: "<node id>", mode: add }   # add | rewire | remove (a removed edge is gone from graph.yaml)
  clis:
    - { command: "<cli command>", mode: rewire }       # add | rewire | polish | remove
